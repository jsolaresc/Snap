<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snap Roulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #0c3b26;
    --felt-dark: #06200f;
    --gold: #d8b25a;
    --gold-soft: #f1d999;
    --text: #f4efe2;
    --muted: rgba(244, 239, 226, .62);
    --red: #b3121f;
    --black: #141414;
    --green: #0f7a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #145a3a 0%, var(--felt) 45%, var(--felt-dark) 100%);
    color: var(--text);
    font-family: "DM Sans", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 3vh, 28px);
    padding: 20px 16px;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 {
    font-family: "Playfair Display", serif;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: clamp(22px, 4vw, 34px);
    color: var(--gold-soft);
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5em;
    text-align: center;
  }
  #logo { height: 1.4em; width: auto; flex: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,.35)); }
  #stage {
    width: min(86vw, 68vh, 620px);
    aspect-ratio: 1;
    position: relative;
  }
  canvas { width: 100%; height: 100%; display: block; }
  #status {
    min-height: 1.4em;
    font-size: clamp(14px, 2.2vw, 17px);
    color: var(--muted);
    text-align: center;
  }
  #status strong { color: var(--gold-soft); font-weight: 700; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    font: 700 15px/1 "DM Sans", system-ui, sans-serif;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 15px 26px;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .12s ease, filter .15s ease, opacity .2s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 3px; }
  #spin {
    background: linear-gradient(180deg, #f0d48a, #c99a3c);
    color: #2a1d05;
    box-shadow: 0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5);
  }
  #reset {
    background: transparent;
    color: var(--text);
    border-color: rgba(244,239,226,.35);
  }

  /* Overlay con el nombre */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 16px;
    background: rgba(4, 12, 8, .62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
    cursor: pointer;
    z-index: 10;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #winner {
    font-family: "Playfair Display", serif;
    font-weight: 900;
    font-size: clamp(64px, 17vw, 200px);
    line-height: 1;
    text-align: center;
    word-break: break-word;
    color: #fff;
    transform: scale(.7);
    transition: transform .5s cubic-bezier(.2, 1.4, .4, 1);
    text-shadow: 0 0 40px var(--glow, rgba(255,255,255,.4)), 0 6px 0 rgba(0,0,0,.35);
  }
  #overlay.show #winner { transform: scale(1); }
  #hint { color: var(--muted); font-size: 14px; letter-spacing: .04em; }
</style>
</head>
<body>
  <h1>
    <img id="logo" src="snap-logo.svg" alt="" onerror="if(!this.dataset.png){this.dataset.png=1;this.src='snap-logo.png'}else{this.remove()}">
    <span>Snap Roulette</span>
  </h1>
  <div id="stage"><canvas id="wheel" aria-label="Ruleta de nombres" role="img"></canvas></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <p id="status" aria-live="polite"></p>
  <div class="controls">
    <button id="spin" type="button">Tirar bola</button>
    <button id="reset" type="button">Resetear ruleta</button>
  </div>

  <div id="overlay" role="dialog" aria-modal="true" aria-labelledby="winner">
    <div id="winner"></div>
    <div id="hint">Click en cualquier lado para continuar</div>
  </div>

<script>
(() => {
  const COLORS = { negro: '#141414', rojo: '#b3121f', verde: '#0f7a3a' };
  const ALL = [
    { name: 'David',    color: 'negro' },
    { name: 'Baltazar', color: 'rojo'  },
    { name: 'Joaco',    color: 'verde', width: 0.8 },  // 20% más angosto
    { name: 'Geno',     color: 'rojo'  },
    { name: 'Mike',     color: 'negro' },
    { name: 'Wilson',   color: 'rojo'  },
  ];
  const STORE_KEY = 'ruleta-restantes-v1';

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spin');
  const resetBtn = document.getElementById('reset');
  const statusEl = document.getElementById('status');
  const overlay = document.getElementById('overlay');
  const winnerEl = document.getElementById('winner');

  const TAU = Math.PI * 2;
  const LAST_STANDING = 'Geno';   // siempre queda último; con él solo, la bola sale volando
  let escaped = false;            // la bola ya salió volando

  // ángulo de inicio y tamaño de cada espacio según su ancho relativo
  function layout() {
    const total = remaining.reduce((t, p) => t + (p.width || 1), 0);
    let a = 0;
    return remaining.map(p => {
      const size = TAU * (p.width || 1) / total;
      const out = { start: a, size, mid: a + size / 2 };
      a += size;
      return out;
    });
  }
  function segmentAt(angle) {   // ángulo relativo a la rueda -> índice
    const L = layout();
    for (let i = 0; i < L.length; i++) if (angle < L[i].start + L[i].size) return i;
    return L.length - 1;
  }
  let remaining = loadRemaining();
  let wheelAngle = 0;
  let ball = null;            // { angle (mundo), r (fracción de R) } o null
  let spinning = false;
  let pendingResult = null;   // índice del nombre que salió
  let size = 0, dpr = 1;

  // ---------- persistencia ----------
  function loadRemaining() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (Array.isArray(saved) && saved.length) {
        const list = ALL.filter(p => saved.includes(p.name));
        if (list.length) return list;
      }
    } catch (e) {}
    return ALL.slice();
  }
  function saveRemaining() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(remaining.map(p => p.name))); } catch (e) {}
  }

  // ---------- tamaño ----------
  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    size = rect.width;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.width * dpr);
    draw();
  }

  // ---------- dibujo ----------
  function draw() {
    const W = canvas.width;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, W);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const c = size / 2;
    const R = size / 2 * 0.97;
    ctx.save();
    ctx.translate(c, c);

    // sombra exterior
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = R * 0.08;
    ctx.shadowOffsetY = R * 0.03;
    circle(R, '#3b200f');
    ctx.restore();

    // aro de madera
    const wood = ctx.createRadialGradient(0, 0, R * 0.8, 0, 0, R);
    wood.addColorStop(0, '#5a3016');
    wood.addColorStop(0.55, '#7a4420');
    wood.addColorStop(1, '#3a1d0b');
    circle(R, wood);
    ring(R * 0.995, 2, 'rgba(241,217,153,.55)');

    // pista de la bola
    const track = ctx.createRadialGradient(0, 0, R * 0.78, 0, 0, R * 0.9);
    track.addColorStop(0, '#2c1608');
    track.addColorStop(0.5, '#6b3c1c');
    track.addColorStop(1, '#2c1608');
    circle(R * 0.9, track);
    ring(R * 0.9, 1.5, 'rgba(241,217,153,.45)');

    // ---- parte que gira ----
    ctx.save();
    ctx.rotate(wheelAngle);
    const n = remaining.length;
    const L = layout();
    const rOuter = R * 0.8, rInner = R * 0.38, rFret = R * 0.69;

    for (let i = 0; i < n; i++) {
      const a0 = L[i].start, a1 = a0 + L[i].size;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, rOuter, a0, a1);
      ctx.closePath();
      ctx.fillStyle = COLORS[remaining[i].color];
      ctx.fill();
    }
    // brillo sobre los segmentos
    const sheen = ctx.createRadialGradient(0, 0, rInner, 0, 0, rOuter);
    sheen.addColorStop(0, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.75, 'rgba(255,255,255,.05)');
    sheen.addColorStop(1, 'rgba(0,0,0,.25)');
    circle(rOuter, sheen);

    // separadores dorados (trastes de los bolsillos)
    ctx.strokeStyle = '#d8b25a';
    ctx.lineCap = 'round';
    for (let i = 0; i < n && n > 1; i++) {
      const a = L[i].start;
      ctx.lineWidth = Math.max(2, R * 0.012);
      line(a, rFret, rOuter);
      ctx.lineWidth = Math.max(1, R * 0.004);
      ctx.strokeStyle = 'rgba(216,178,90,.6)';
      line(a, rInner, rFret);
      ctx.strokeStyle = '#d8b25a';
    }
    ring(rOuter, Math.max(2, R * 0.012), '#d8b25a');
    ring(rFret, Math.max(1, R * 0.006), 'rgba(216,178,90,.85)');

    // nombres
    const fontPx = R * 0.082;
    for (let i = 0; i < n; i++) {
      const mid = L[i].mid;
      ctx.save();
      ctx.rotate(mid);
      ctx.fillStyle = '#f4efe2';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let fs = fontPx;
      ctx.font = `700 ${fs}px "DM Sans", system-ui, sans-serif`;
      const maxW = (rFret - rInner) * 0.88;
      const w = ctx.measureText(remaining[i].name).width;
      if (w > maxW) { fs *= maxW / w; ctx.font = `700 ${fs}px "DM Sans", system-ui, sans-serif`; }
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = 4;
      ctx.fillText(remaining[i].name, (rInner + rFret) / 2, 0);
      ctx.restore();
    }

    // cono central
    const cone = ctx.createRadialGradient(-rInner * 0.3, -rInner * 0.3, rInner * 0.05, 0, 0, rInner);
    cone.addColorStop(0, '#8a5328');
    cone.addColorStop(0.6, '#5a3016');
    cone.addColorStop(1, '#2e1607');
    circle(rInner, cone);
    ring(rInner, Math.max(2, R * 0.01), '#d8b25a');

    // torreta dorada
    const goldG = ctx.createLinearGradient(-R * 0.2, -R * 0.2, R * 0.2, R * 0.2);
    goldG.addColorStop(0, '#fbe7b0');
    goldG.addColorStop(0.5, '#d8b25a');
    goldG.addColorStop(1, '#8c6a25');
    ctx.fillStyle = goldG;
    for (let k = 0; k < 4; k++) {
      ctx.save();
      ctx.rotate(k * TAU / 4);
      ctx.beginPath();
      ctx.moveTo(0, -R * 0.025);
      ctx.lineTo(R * 0.26, -R * 0.008);
      ctx.arc(R * 0.27, 0, R * 0.02, -Math.PI / 2, Math.PI / 2);
      ctx.lineTo(0, R * 0.025);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    circle(R * 0.07, goldG);
    circle(R * 0.035, '#fbe7b0');
    ctx.restore();
    // ---- fin parte que gira ----

    // bola
    if (ball) {
      const br = R * 0.034;
      const bx = Math.cos(ball.angle) * ball.r * R;
      const by = Math.sin(ball.angle) * ball.r * R;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.6)';
      ctx.shadowBlur = br * 0.9;
      ctx.shadowOffsetY = br * 0.35;
      const bg = ctx.createRadialGradient(bx - br * 0.35, by - br * 0.4, br * 0.1, bx, by, br);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(0.55, '#e9e6df');
      bg.addColorStop(1, '#9d988c');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function circle(r, fill) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fillStyle = fill; ctx.fill();
  }
  function ring(r, w, stroke) {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.lineWidth = w; ctx.strokeStyle = stroke; ctx.stroke();
  }
  function line(a, r0, r1) {
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
    ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.stroke();
  }

  // ---------- sonido ----------
  // ruleta.mp3 suena mientras gira la bola (si no carga, se sintetiza el sonido).
  // success.mp3 suena al mostrar el nombre.
  const audioFile = new Audio('ruleta.mp3');
  let useFile = true;
  audioFile.preload = 'auto';
  audioFile.addEventListener('error', () => { useFile = false; });

  const successAudio = new Audio('success.mp3');
  successAudio.preload = 'auto';
  let successUnlocked = false;
  function unlockSuccess() {   // iOS/Safari solo deja reproducir audio iniciado por un toque
    if (successUnlocked) return;
    successUnlocked = true;
    successAudio.muted = true;
    const pr = successAudio.play();
    if (pr && pr.then) pr.then(() => { successAudio.pause(); successAudio.muted = false; })
                         .catch(() => { successAudio.muted = false; });
    else { successAudio.pause(); successAudio.muted = false; }
  }
  function playSuccess() {
    try {
      successAudio.pause();
      successAudio.muted = false;
      successAudio.currentTime = 0;
      const pr = successAudio.play();
      if (pr && pr.catch) pr.catch(() => {});
    } catch (e) {}
  }

  let actx = null, noiseBuf = null, roll = null;
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function startRoll() {
    if (useFile) {
      try {
        audioFile.currentTime = 0; audioFile.volume = 1;
        const pr = audioFile.play();
        if (pr && pr.catch) pr.catch(() => {});
      } catch (e) {}
      return;
    }
    const a = audio(); if (!a) return;
    const src = a.createBufferSource();
    src.buffer = noiseBuf; src.loop = true;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.value = 900;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2500;
    const g = a.createGain(); g.gain.value = 0;
    src.connect(bp).connect(lp).connect(g).connect(a.destination);
    src.start();
    roll = { src, bp, g };
  }
  function setRoll(speed, vol) {   // speed y vol entre 0 y 1
    if (!roll) return;
    const t = actx.currentTime;
    roll.bp.frequency.setTargetAtTime(250 + speed * 1100, t, 0.05);
    roll.g.gain.setTargetAtTime(vol * (0.06 + speed * 0.22), t, 0.05);
  }
  function stopRoll() {
    if (!roll) return;
    const r = roll; roll = null;
    r.g.gain.setTargetAtTime(0, actx.currentTime, 0.08);
    setTimeout(() => { try { r.src.stop(); } catch (e) {} }, 600);
  }
  function stopFile() {
    if (!useFile || audioFile.paused) return;
    const fade = setInterval(() => {
      audioFile.volume = Math.max(0, audioFile.volume - 0.1);
      if (audioFile.volume <= 0) { clearInterval(fade); audioFile.pause(); }
    }, 40);
  }
  function click(vol, pitch = 1) {   // golpe de la bola contra madera/metal
    if (useFile || !actx || vol <= 0.01) return;
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    const hp = actx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 2600 * pitch; hp.Q.value = 3;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.9 * vol, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    src.connect(hp).connect(g).connect(actx.destination);
    src.start(t, Math.random()); src.stop(t + 0.06);
    const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.value = 1500 * pitch;
    const og = actx.createGain();
    og.gain.setValueAtTime(0.35 * vol, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    o.connect(og).connect(actx.destination); o.start(t); o.stop(t + 0.04);
  }

  // ---------- animación ----------
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const mod = (a, m) => ((a % m) + m) % m;

  const TRACK_R = 0.845, POCKET_R = 0.745;

  // Línea de tiempo sincronizada con ruleta.mp3 (segundos medidos sobre el audio)
  const T_DESCEND = 5.45;   // la bola empieza a bajar de la pista
  // golpes de la bola en el audio: rebotes grandes y luego el traqueteo dentro del bolsillo
  const IMPACTS = [5.77, 5.83, 5.96, 6.05, 6.19, 6.24, 6.28, 6.31, 6.34, 6.37, 6.40];
  const T_SETTLE = 6.44;    // queda quieta en el bolsillo
  const T_END = 7.0;        // fin de la animación (la rueda se detiene)
  const BIG_IMPACTS = 5;    // los primeros cinco son rebotes grandes

  let lastTs = performance.now();
  let spinState = null;

  // velocidad relativa bola-rueda (rad/s) en el instante t
  function relSpeed(t) {
    const w0 = 16, w1 = 4;
    if (t < IMPACTS[0]) return w1 + (w0 - w1) * Math.pow(1 - t / IMPACTS[0], 1.5);
    if (t >= T_SETTLE) return 0;
    let w = w1;
    for (let i = 0; i < IMPACTS.length && IMPACTS[i] <= t; i++) w *= i < BIG_IMPACTS ? 0.55 : 0.8;
    return w * Math.sqrt(1 - (t - IMPACTS[0]) / (T_SETTLE - IMPACTS[0]));
  }

  // radio de la bola (fracción de R) en el instante t
  function ballRadius(t) {
    if (t < T_DESCEND) return TRACK_R;
    const firstR = 0.805;
    if (t < IMPACTS[0]) {
      const u = (t - T_DESCEND) / (IMPACTS[0] - T_DESCEND);
      return TRACK_R - (TRACK_R - firstR) * u * u;   // cae acelerando hacia los trastes
    }
    if (t >= T_SETTLE) return POCKET_R;
    const pts = IMPACTS.concat([T_SETTLE]);
    const impactR = i => i >= BIG_IMPACTS - 1 ? POCKET_R
      : firstR + (POCKET_R - firstR) * (i / (BIG_IMPACTS - 1));
    for (let i = 0; i < pts.length - 1; i++) {
      if (t < pts[i + 1]) {
        const gap = pts[i + 1] - pts[i];
        const u = (t - pts[i]) / gap;
        const h = Math.min(0.045, 1.8 * gap * gap);  // altura del rebote según el tiempo en el aire
        return impactR(i) + (impactR(i + 1) - impactR(i)) * u + h * 4 * u * (1 - u);
      }
    }
    return POCKET_R;
  }

  function spin() {
    if (spinning || escaped || remaining.length < 1) return;
    spinning = true;
    unlockSuccess();
    updateUI();

    // un punto al azar de la rueda: los espacios más angostos salen proporcionalmente menos
    const onlyLast = remaining.length === 1 && remaining[0].name === LAST_STANDING;
    let target = 0;
    if (!onlyLast) {
      do { target = segmentAt(Math.random() * TAU); }
      while (remaining[target].name === LAST_STANDING);
    }
    const L = layout();
    const offset = (Math.random() - 0.5) * L[target].size * 0.5;   // no siempre en el centro exacto

    // posición relativa de la bola integrada en el tiempo, terminando en el espacio elegido
    const DT = 1 / 240, steps = Math.ceil(T_SETTLE / DT);
    const rel = new Float32Array(steps + 1);
    for (let i = 1; i <= steps; i++) rel[i] = rel[i - 1] + relSpeed((i - 0.5) * DT) * DT;
    const travel = rel[steps];
    const relEnd = L[target].mid + offset;
    // la bola gira en sentido contrario a la rueda: el ángulo relativo disminuye
    const relAt = t => {
      const x = Math.min(steps, Math.max(0, t / DT));
      const i = Math.floor(x), f = x - i;
      const v = i >= steps ? rel[steps] : rel[i] + (rel[i + 1] - rel[i]) * f;
      return relEnd + (travel - v);
    };

    spinState = {
      start: performance.now(), lastT: 0, target, relAt,
      wStart: wheelAngle, W: TAU * (2 + Math.random()),   // la rueda gira en sentido horario
      nextImpact: 0, lastSeg: null, escape: onlyLast,
    };
    startRoll();
    ball = { angle: wheelAngle + relAt(0), r: TRACK_R };
  }

  // reloj de la animación: sigue al audio cuando está sonando
  function spinClock(now) {
    const s = spinState;
    let t = (now - s.start) / 1000;
    if (useFile && !audioFile.paused && !audioFile.ended && audioFile.currentTime > 0) {
      t = audioFile.currentTime;
    }
    t = Math.max(s.lastT, t);
    s.lastT = t;
    return t;
  }

  function stepSpin(now) {
    const s = spinState;
    const t = spinClock(now);
    wheelAngle = s.wStart + s.W * easeOutCubic(Math.min(1, t / T_END));
    ball.angle = wheelAngle + s.relAt(t);
    ball.r = ballRadius(t);

    if (s.escape && t >= IMPACTS[0]) {   // golpea el traste y sale despedida
      launchBall(s);
      return;
    }

    // sonido sintetizado (solo si ruleta.mp3 no está disponible)
    if (t < IMPACTS[0]) {
      setRoll(Math.min(1, relSpeed(t) / 16 + 0.15), t < T_DESCEND ? 1 : 0.6);
    } else {
      stopRoll();
    }
    while (s.nextImpact < IMPACTS.length && t >= IMPACTS[s.nextImpact]) {
      const big = s.nextImpact < BIG_IMPACTS;
      click(big ? 0.9 - s.nextImpact * 0.12 : 0.25, big ? 0.8 + Math.random() * 0.2 : 1.1);
      s.nextImpact++;
    }
    if (!useFile && remaining.length > 1 && t > IMPACTS[0] && t < T_SETTLE) {
      const seg = segmentAt(mod(ball.angle - wheelAngle, TAU));
      if (s.lastSeg !== null && seg !== s.lastSeg) click(0.3, 1.3 + Math.random() * 0.3);
      s.lastSeg = seg;
    }

    if (t >= T_END) {
      stopRoll();
      spinState = null;
      pendingResult = s.target;
      setTimeout(showResult, 650);
    }
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;
    if (spinState) {
      stepSpin(now);
    } else if (!spinning && !ball) {
      wheelAngle += dt * 0.12;  // giro lento en reposo
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- la bola sale volando ----------
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  function sizeFx() {
    const d = Math.min(window.devicePixelRatio || 1, 2.5);
    fx.width = Math.round(innerWidth * d);
    fx.height = Math.round(innerHeight * d);
    fctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function launchBall(s) {
    spinState = null;
    stopRoll();
    click(1, 0.7);
    setTimeout(stopFile, 120);

    const rect = canvas.getBoundingClientRect();
    const R = size / 2 * 0.97;
    const a = ball.angle;
    const x0 = rect.left + rect.width / 2 + Math.cos(a) * ball.r * R;
    const y0 = rect.top + rect.height / 2 + Math.sin(a) * ball.r * R;
    const br0 = R * 0.034;
    // la bola viaja en sentido antihorario: tangente + empuje hacia afuera y hacia arriba
    const tx = Math.sin(a), ty = -Math.cos(a), ox = Math.cos(a), oy = Math.sin(a);
    const speed = Math.max(innerWidth, innerHeight) * 1.1;
    const vx = (tx * 0.55 + ox * 0.85) * speed;
    const vy = (ty * 0.55 + oy * 0.85) * speed - speed * 0.35;
    const g = speed * 1.4;
    ball = null;
    sizeFx();

    const t0 = performance.now();
    function frame(now) {
      const t = (now - t0) / 1000;
      const k = 1 + t * 2.2;   // se acerca a la cámara
      const x = x0 + vx * t;
      const y = y0 + vy * t + 0.5 * g * t * t;
      const br = br0 * k * k;
      fctx.clearRect(0, 0, innerWidth, innerHeight);
      const off = x + br < 0 || x - br > innerWidth || y - br > innerHeight || y + br < 0;
      if (off || t > 2.5) {
        escaped = true;
        spinning = false;
        updateUI();
        return;
      }
      fctx.save();
      fctx.shadowColor = 'rgba(0,0,0,.5)';
      fctx.shadowBlur = br * 0.8;
      fctx.shadowOffsetY = br * 0.4;
      const bg = fctx.createRadialGradient(x - br * 0.35, y - br * 0.4, br * 0.1, x, y, br);
      bg.addColorStop(0, '#ffffff');
      bg.addColorStop(0.55, '#e9e6df');
      bg.addColorStop(1, '#9d988c');
      fctx.fillStyle = bg;
      fctx.beginPath();
      fctx.arc(x, y, br, 0, TAU);
      fctx.fill();
      fctx.restore();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ---------- resultado ----------
  function showResult() {
    stopFile();
    playSuccess();
    const p = remaining[pendingResult];
    winnerEl.textContent = p.name;
    winnerEl.style.setProperty('--glow', COLORS[p.color] === COLORS.negro ? 'rgba(255,255,255,.35)' : COLORS[p.color]);
    overlay.classList.add('show');
  }

  function dismiss() {
    if (!overlay.classList.contains('show')) return;
    overlay.classList.remove('show');
    successAudio.pause();
    if (pendingResult !== null && remaining.length > 1) {
      // mantener la rueda visualmente estable al quitar un segmento
      remaining.splice(pendingResult, 1);
      pendingResult = null;
      saveRemaining();
    }
    pendingResult = null;
    ball = null;
    spinning = false;
    updateUI();
  }

  function reset() {
    if (spinning) return;
    remaining = ALL.slice();
    escaped = false;
    ball = null;
    pendingResult = null;
    saveRemaining();
    updateUI();
  }

  function updateUI() {
    spinBtn.disabled = spinning || escaped;
    resetBtn.disabled = spinning;
    if (escaped) {
      statusEl.textContent = '¡La bola salió volando!';
    } else if (remaining.length === 1) {
      statusEl.innerHTML = `Quedó solo <strong>${remaining[0].name}</strong>`;
    } else if (spinning) {
      statusEl.textContent = 'No va más…';
    } else {
      statusEl.textContent = `Quedan ${remaining.length} nombres`;
    }
  }

  spinBtn.addEventListener('click', spin);
  resetBtn.addEventListener('click', reset);
  overlay.addEventListener('click', dismiss);
  document.addEventListener('keydown', e => {
    if (overlay.classList.contains('show') && (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape')) {
      e.preventDefault();
      dismiss();
    }
  });
  window.addEventListener('resize', resize);

  updateUI();
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
